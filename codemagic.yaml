# Codemagic CI config — builds & ships Tidal (Capacitor) to TestFlight/App Store
# WITHOUT needing a Mac on your end.
#
# SETUP (one time): add your App Store Connect API key as a secure variable
# group named "appstore" in Codemagic (see the steps your assistant gave you):
#   APP_STORE_CONNECT_ISSUER_ID       = the Issuer ID (a UUID)
#   APP_STORE_CONNECT_KEY_IDENTIFIER  = the Key ID (~10 chars)
#   APP_STORE_CONNECT_PRIVATE_KEY     = the FULL contents of the .p8 file
#                                       (including the BEGIN/END lines)
#   CERTIFICATE_PRIVATE_KEY           = the full contents of cert_private_key.pem
#                                       (generated locally; reused every build)
# Mark them all "Secure". Then set BUNDLE_ID below to match capacitor.config.json.
# NOTE: the App Store Connect API key must have ADMIN access to create the
# distribution certificate & provisioning profile.

workflows:
  ios-tidal:
    name: Tidal iOS
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      groups:
        - appstore          # the variable group you create in the Codemagic UI
      vars:
        BUNDLE_ID: "com.mschaefer20.tidal"
        XCODE_WORKSPACE: "ios/App/App.xcworkspace"
        XCODE_SCHEME: "App"
      node: 20
      xcode: latest
      cocoapods: default
    scripts:
      - name: Install npm dependencies
        script: npm install
      - name: Add iOS platform (if not committed)
        script: |
          if [ ! -d "ios" ]; then npx cap add ios; fi
      - name: Sync web assets + plugins into the native project
        script: npx cap sync ios
      - name: Make the app iPhone-only (no iPad)
        script: node ci/iphone-only.js
      - name: Enable Game Center capability
        script: node ci/enable-gamecenter.js
      - name: Configure Info.plist (compliance + portrait lock)
        script: |
          PLIST=ios/App/App/Info.plist
          # Marketing version — single source of truth in ci/version.js
          MV=$(node -p "require('./ci/version').MARKETING_VERSION")
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $MV" "$PLIST" \
            || /usr/libexec/PlistBuddy -c "Add :CFBundleShortVersionString string $MV" "$PLIST"
          # Encryption compliance (no custom encryption)
          /usr/libexec/PlistBuddy -c "Add :ITSAppUsesNonExemptEncryption bool false" "$PLIST" \
            || /usr/libexec/PlistBuddy -c "Set :ITSAppUsesNonExemptEncryption false" "$PLIST"
          # Portrait only (applies to iPhone and iPad)
          /usr/libexec/PlistBuddy -c "Delete :UISupportedInterfaceOrientations" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :UISupportedInterfaceOrientations array" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :UISupportedInterfaceOrientations:0 string UIInterfaceOrientationPortrait" "$PLIST"
          # Remove any iPad-specific orientation list and opt out of iPad
          # multitasking so portrait-only is allowed (Apple validation 90474).
          /usr/libexec/PlistBuddy -c "Delete :UISupportedInterfaceOrientations~ipad" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :UIRequiresFullScreen bool true" "$PLIST" \
            || /usr/libexec/PlistBuddy -c "Set :UIRequiresFullScreen true" "$PLIST"
      - name: Configure audio session (play through the mute switch)
        script: node ci/configure-audio.js
      - name: Generate app icon & splash
        script: npx capacitor-assets generate --ios || true
      - name: Install CocoaPods
        script: cd ios/App && pod install
      - name: Fetch signing files & set up keychain (uses the API key)
        script: |
          keychain initialize
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --certificate-key="@env:CERTIFICATE_PRIVATE_KEY" \
            --create
          keychain add-certificates
          xcode-project use-profiles
      - name: Set build number (Codemagic's monotonic build counter)
        script: |
          cd ios/App
          agvtool new-version -all "$BUILD_NUMBER"
      - name: Build IPA
        script: |
          xcode-project build-ipa \
            --workspace "$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        # Upload only. The build is then available to INTERNAL TestFlight testers
        # immediately (no beta review). To enable EXTERNAL testers, fill in the
        # TestFlight test info in App Store Connect, then set this to true.
        submit_to_testflight: false
        # submit_to_app_store: false   # flip to true once you're ready to release

  # ---------------------------------------------------------------------------
  # Combined release: ONE run -> signed IPA (auto-uploaded to App Store
  # Connect, as before) + signed Android .aab auto-uploaded to the Google
  # Play track below (the publisher promotes it in Play Console). Both
  # artifacts come from the same commit and share $BUILD_NUMBER (iOS build
  # number == Android versionCode), so the stores stay in lockstep. The
  # Android half builds FIRST: if it fails, no IPA is produced or uploaded —
  # both or neither.
  #
  # Extra one-time setup: a "googleplay" variable group in the Codemagic UI:
  #   CM_KEYSTORE          = base64 of play-upload.jks — the PUBLISHER'S
  #     upload keystore (PKCS12; Play locked the app to it on first upload)
  #   CM_KEYSTORE_PASSWORD = its password
  #   CM_KEY_ALIAS         = "tidal-upload"
  #   CM_KEY_PASSWORD      = same as CM_KEYSTORE_PASSWORD
  #   GCLOUD_SERVICE_ACCOUNT_CREDENTIALS = full JSON key of a Play service
  #     account with release access to the app (created on the publisher's
  #     account — see BUILD-ANDROID.md "Service account" section)
  # Mark all Secure. Keep play-upload.jks + its password safely backed up —
  # it is the app's permanent upload key. (The locally generated
  # tidal-upload.jks was never used on Play and is obsolete.)
  release-tidal:
    name: Tidal iOS + Android
    instance_type: mac_mini_m2
    max_build_duration: 90
    environment:
      groups:
        - appstore
        - googleplay
      vars:
        BUNDLE_ID: "com.mschaefer20.tidal"   # iOS only — the Android package
        # name is io.github.mschaefer20.tidal, patched by ci/android-config.js
        # (the publisher's Play app was created under that id; it's permanent).
        XCODE_WORKSPACE: "ios/App/App.xcworkspace"
        XCODE_SCHEME: "App"
        # Play track the .aab is pushed to on every run. "internal" is safe
        # (instant, up to 100 testers); switch to the closed-track name or
        # "production" once you want releases to go further automatically.
        GOOGLE_PLAY_TRACK: "internal"
      node: 20
      xcode: latest
      cocoapods: default
      java: 17
    scripts:
      - name: Install npm dependencies
        script: npm install
      - name: Add native platforms (regenerated every build)
        script: |
          if [ ! -d "ios" ]; then npx cap add ios; fi
          if [ ! -d "android" ]; then npx cap add android; fi
      - name: Sync web assets + plugins into both native projects
        script: npx cap sync
      - name: Make the app iPhone-only (no iPad)
        script: node ci/iphone-only.js
      - name: Enable Game Center capability
        script: node ci/enable-gamecenter.js
      - name: Configure Info.plist (compliance + portrait lock)
        script: |
          PLIST=ios/App/App/Info.plist
          MV=$(node -p "require('./ci/version').MARKETING_VERSION")
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $MV" "$PLIST" \
            || /usr/libexec/PlistBuddy -c "Add :CFBundleShortVersionString string $MV" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :ITSAppUsesNonExemptEncryption bool false" "$PLIST" \
            || /usr/libexec/PlistBuddy -c "Set :ITSAppUsesNonExemptEncryption false" "$PLIST"
          /usr/libexec/PlistBuddy -c "Delete :UISupportedInterfaceOrientations" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :UISupportedInterfaceOrientations array" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :UISupportedInterfaceOrientations:0 string UIInterfaceOrientationPortrait" "$PLIST"
          /usr/libexec/PlistBuddy -c "Delete :UISupportedInterfaceOrientations~ipad" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :UIRequiresFullScreen bool true" "$PLIST" \
            || /usr/libexec/PlistBuddy -c "Set :UIRequiresFullScreen true" "$PLIST"
      - name: Configure audio session (play through the mute switch)
        script: node ci/configure-audio.js
      - name: Generate app icons & splash (both platforms)
        script: |
          npx capacitor-assets generate --ios || true
          npx capacitor-assets generate --android || true
      - name: Prepare Android signing (upload keystore from env)
        script: |
          echo "$CM_KEYSTORE" | base64 --decode > /tmp/tidal-upload.jks
          echo "CM_KEYSTORE_PATH=/tmp/tidal-upload.jks" >> $CM_ENV
      - name: Configure Android project (version, portrait, signing)
        script: node ci/android-config.js
      - name: Build signed Android bundle + APK
        script: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > android/local.properties
          cd android
          ./gradlew bundleRelease assembleRelease
      - name: Install CocoaPods
        script: cd ios/App && pod install
      - name: Fetch signing files & set up keychain (uses the API key)
        script: |
          keychain initialize
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --certificate-key="@env:CERTIFICATE_PRIVATE_KEY" \
            --create
          keychain add-certificates
          xcode-project use-profiles
      - name: Set iOS build number (matches Android versionCode)
        script: |
          cd ios/App
          agvtool new-version -all "$BUILD_NUMBER"
      - name: Build IPA
        script: |
          xcode-project build-ipa \
            --workspace "$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - android/app/build/outputs/bundle/release/*.aab
      - android/app/build/outputs/apk/release/*.apk
      - android/app/build/outputs/mapping/release/mapping.txt
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: false
      # Auto-upload the .aab to the publisher's Play Console. Mirrors the iOS
      # behavior: the build lands on the track, going further (promotion to
      # production / rollout) stays a manual step in Play Console.
      google_play:
        credentials: $GCLOUD_SERVICE_ACCOUNT_CREDENTIALS
        track: $GOOGLE_PLAY_TRACK
        submit_as_draft: false
